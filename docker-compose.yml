services:
  postgres:
    image: postgres:16
    container_name: mentoros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mentoros
      POSTGRES_USER: mentoros
      POSTGRES_PASSWORD: mentoros_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: